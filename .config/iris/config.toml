[core]
version = 1
shell = "zsh"
shell-login = false
mode = "last"
debug = false
expand-alias = true
auto-execute = false
atuin-history = 0
atuin-db-path = ""
cobra-probe-enabled = true

[ui]
style = "modern"
ghost-text = false
hidden-files = true
max-suggestions = 100
max-height = 25
max-width = 0
nerd-fonts = true

[keybindings]
toggle-mode = "ctrl+t"
toggle-menu = "ctrl+space"
select = "ctrl+y"
navigate-up = "ctrl+k"
navigate-down = "ctrl+j"
navigate-right = "ctrl+right"

[git]
filter-active-branch = true
deduplicate-branches = true

[updater]
check-on-startup = true
channel = "stable"
check-interval = "24h"

[ai]
enabled = true
provider = "groq"
debounce_ms = 200

[ai.providers.groq]
endpoint = "https://api.groq.com/openai/v1/chat/completions"
api_key_env = "GROQ_API_KEY"
model = "llama-3.3-70b-versatile"
timeout_ms = 3000

[ai.providers.ollama]
endpoint = "http://localhost:11434/v1/chat/completions"
model = "qwen2.5-coder"
timeout_ms = 5000
